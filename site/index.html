<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoneyDJ 每日選股追蹤</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c1422;color:#e5edf7;font:15px system-ui}main{max-width:1240px;margin:auto;padding:36px 22px}header{border-bottom:1px solid #354359;padding-bottom:22px}h1{font-size:clamp(26px,5vw,44px);margin:8px 0}small,a{color:#6fe2c3}p{color:#b9c9dc}button,input,select{font:inherit;background:#152439;color:inherit;border:1px solid #435574;border-radius:8px;padding:9px}button,select{cursor:pointer}button[aria-current=true]{background:#6fe2c3;color:#102328}nav,.filters{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.scroll{overflow:auto;border:1px solid #354359;border-radius:12px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:12px;border-bottom:1px solid #29374c}th{background:#1b2a40}tr:nth-child(even){background:#131f30}.up{color:#ff9c96}.down{color:#6fe2c3}aside{background:#152439;padding:16px;border-radius:12px;margin:15px 0}label{display:inline-flex;align-items:center;gap:5px}
</style><main><header><small>MONEYDJ / 選股觀察室</small><h1>每日選股追蹤</h1><p id="stats"></p><a href="https://docs.google.com/spreadsheets/d/1Wt1ci1XCuH9J7048mAOKAXXdIUmYRAdOoQGixgxz8yo/edit?usp=drivesdk" target="_blank" rel="noopener">開啟 Google 試算表</a></header>
<nav><button data-page="0">強勢總覽</button><button data-page="1">基本面候選</button><button data-page="2">歷史追蹤</button><button data-page="3">並排比較 <span id="count"></span></button></nav>
<div class="filters"><input id="q" type="search" aria-label="股票代號或名稱" placeholder="搜尋代號或名稱"><label>觀察窗 <select id="days"><option value="5">5 日</option><option value="4">4 日</option><option value="3">3 日</option></select></label><label>分類 <select id="kind"><option value="">全部</option><option>連續強勢</option><option>單日急漲</option><option>重複出現</option><option>單日出現</option></select></label><label>排序 <select id="sort"><option value="hits">出現次數</option><option value="gain">最近漲幅</option><option value="last">最近出現</option><option value="first">首次出現</option><option value="code">股票代號</option></select></label><label><input type="checkbox" id="asc">升冪</label><label id="dateWrap">資料日 <select id="date"></select></label></div>
<p id="note"></p><div id="view"></div>
<aside><details><summary>新增每日資料</summary><p>將 Google 試算表的歷史明細分頁下載成 CSV，再匯入。必備欄位為「日期」（或「資料日期」）、「股票代號」、「股票名稱」、「收盤價」、「漲跌幅」。同日同代號會更新，所有頁面隨即重算。新增紀錄儲存在目前瀏覽器。</p><input id="file" type="file" accept=".csv,text/csv" aria-label="匯入 CSV"><p id="status" role="status"></p></details></aside></main>
